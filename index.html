<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f5f3ee">
    <title>Flow Field Genesis - Generative Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1a1a1a;
            --paper: #f5f3ee;
            --paper-soft: #ebe8e0;
            --mid: #8a8580;
            --line: #d8d4cc;
            --accent: #b85a3a;
            --accent-soft: rgba(184, 90, 58, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--paper);
            min-height: 100vh;
            color: var(--ink);
            overflow: hidden;
            font-weight: 300;
        }

        .app {
            display: flex;
            height: 100vh;
            height: 100dvh;
            position: relative;
        }

        /* ── Canvas fills the screen ── */
        #canvas-container {
            position: absolute;
            inset: 0;
            background: var(--paper);
            touch-action: none;
        }

        #canvas-container canvas {
            display: block;
            touch-action: none;
        }

        /* ── Minimal floating title (top-left) ── */
        .title-card {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 20;
            pointer-events: none;
            max-width: 60vw;
        }

        .title-card h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            font-weight: 500;
            letter-spacing: -0.5px;
            line-height: 1;
            color: var(--ink);
            text-shadow: 0 1px 2px rgba(245, 243, 238, 0.8);
        }

        .title-card .meta {
            font-size: 11px;
            color: var(--mid);
            margin-top: 6px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 400;
        }

        .title-card .meta b { color: var(--accent); font-weight: 500; }

        /* ── Hint pill (bottom-center, fades after a few seconds) ── */
        .hint-pill {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(26, 26, 26, 0.78);
            color: var(--paper);
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 12px;
            letter-spacing: 0.4px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            white-space: nowrap;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }

        .hint-pill.fade { opacity: 0; }

        /* ── Gear button (opens panel) ── */
        .panel-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 30;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: rgba(245, 243, 238, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--ink);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            touch-action: manipulation;
        }

        .panel-toggle:hover, .panel-toggle:active {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ── Control panel (drawer) ── */
        .panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 340px;
            max-width: 88vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(245, 243, 238, 0.97);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--line);
            z-index: 40;
            transform: translateX(105%);
            transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            overflow-x: hidden;
            padding: 28px 26px 40px;
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.08);
        }

        .panel.open { transform: translateX(0); }

        .panel h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .panel .panel-sub {
            font-size: 11px;
            color: var(--mid);
            margin-bottom: 28px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .section { margin-bottom: 26px; }

        .section-label {
            font-size: 10px;
            font-weight: 500;
            color: var(--mid);
            text-transform: uppercase;
            letter-spacing: 1.6px;
            margin-bottom: 12px;
        }

        /* Palette selector */
        .palettes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .palette-chip {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            background: var(--paper);
            transition: all 0.18s ease;
            text-align: left;
        }

        .palette-chip:hover { border-color: var(--accent); }

        .palette-chip.active {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .palette-swatches {
            display: flex;
            gap: 2px;
            height: 14px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .palette-swatches span { flex: 1; }

        .palette-name {
            font-size: 11px;
            color: var(--ink);
            font-weight: 400;
        }

        /* Seed input */
        .seed-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .seed-input {
            flex: 1;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 12px;
            font-family: 'Inter', monospace;
            font-size: 13px;
            text-align: center;
            color: var(--ink);
            font-weight: 400;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--accent);
            background: white;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--paper);
            cursor: pointer;
            font-size: 14px;
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
            touch-action: manipulation;
            flex-shrink: 0;
        }

        .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
        .icon-btn:active { transform: scale(0.96); }

        /* Sliders */
        .slider-group { margin-bottom: 18px; }

        .slider-group .label-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .slider-group .label {
            font-size: 12px;
            color: var(--ink);
            font-weight: 400;
        }

        .slider-group .value {
            font-size: 11px;
            color: var(--mid);
            font-variant-numeric: tabular-nums;
        }

        input[type="range"] {
            width: 100%;
            height: 3px;
            background: var(--line);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(184, 90, 58, 0.35);
            transition: transform 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        input[type="range"]::-moz-range-thumb {
            width: 16px; height: 16px;
            background: var(--accent);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(184, 90, 58, 0.35);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.18s ease;
            touch-action: manipulation;
        }

        .btn-primary {
            background: var(--ink);
            color: var(--paper);
        }

        .btn-primary:hover, .btn-primary:active {
            background: var(--accent);
        }

        .btn-row { display: flex; gap: 8px; }
        .btn-row .btn { flex: 1; }

        .btn-ghost {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--line);
        }

        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

        /* Scrim */
        .scrim {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(26, 26, 26, 0.25);
            z-index: 35;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .scrim.show { display: block; opacity: 1; }

        /* Loading */
        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--mid);
            font-size: 13px;
            letter-spacing: 1px;
            z-index: 10;
        }

        @media (max-width: 600px) {
            .title-card { top: 16px; left: 16px; }
            .title-card h1 { font-size: 22px; }
            .title-card .meta { font-size: 10px; }
            .panel-toggle { top: 16px; right: 16px; width: 40px; height: 40px; }
            .hint-pill { bottom: 16px; font-size: 11px; padding: 8px 16px; }
            .panel { padding: 24px 20px 32px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div id="canvas-container">
            <div class="loading">Composing the field…</div>
        </div>

        <div class="title-card">
            <h1>Flow Field Genesis</h1>
            <div class="meta">Palette <b id="tc-palette">Lavender</b> · Seed <b id="tc-seed">12345</b></div>
        </div>

        <button class="panel-toggle" id="panel-toggle" aria-label="Open controls">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>

        <div class="scrim" id="scrim"></div>

        <div class="panel" id="panel">
            <h2>Controls</h2>
            <div class="panel-sub">Tune the composition</div>

            <div class="section">
                <div class="section-label">Palette</div>
                <div class="palettes" id="palettes"></div>
            </div>

            <div class="section">
                <div class="section-label">Seed</div>
                <div class="seed-row">
                    <input type="number" id="seed-input" class="seed-input" value="12345">
                    <button class="icon-btn" id="seed-prev" aria-label="Previous seed">‹</button>
                    <button class="icon-btn" id="seed-next" aria-label="Next seed">›</button>
                </div>
                <button class="icon-btn" id="seed-random" style="width:100%;height:38px;" aria-label="Random seed">⟲ Random Seed</button>
            </div>

            <div class="section">
                <div class="section-label">Parameters</div>

                <div class="slider-group">
                    <div class="label-row"><span class="label">Particles</span><span class="value" id="v-count">6000</span></div>
                    <input type="range" id="s-count" min="2000" max="15000" step="500" value="6000">
                </div>

                <div class="slider-group">
                    <div class="label-row"><span class="label">Flow Speed</span><span class="value" id="v-speed">0.6</span></div>
                    <input type="range" id="s-speed" min="0.1" max="2.0" step="0.1" value="0.6">
                </div>

                <div class="slider-group">
                    <div class="label-row"><span class="label">Noise Scale</span><span class="value" id="v-noise">0.0030</span></div>
                    <input type="range" id="s-noise" min="0.0008" max="0.0120" step="0.0002" value="0.0030">
                </div>

                <div class="slider-group">
                    <div class="label-row"><span class="label">Density Pull</span><span class="value" id="v-density">0.8</span></div>
                    <input type="range" id="s-density" min="0" max="2.0" step="0.1" value="0.8">
                </div>

                <div class="slider-group">
                    <div class="label-row"><span class="label">Trail Fade</span><span class="value" id="v-trail">0.45</span></div>
                    <input type="range" id="s-trail" min="0.10" max="0.80" step="0.02" value="0.45">
                </div>
            </div>

            <div class="section">
                <div class="section-label">Actions</div>
                <button class="btn btn-primary" id="btn-regenerate" style="margin-bottom:8px;">Regenerate</button>
                <div class="btn-row">
                    <button class="btn btn-ghost" id="btn-pause">Pause</button>
                    <button class="btn btn-ghost" id="btn-save">Save PNG</button>
                </div>
            </div>
        </div>

        <div class="hint-pill" id="hint">Drag to disturb · Tap to seed new life</div>
    </div>

    <script>
    // ══════════════════════════════════════════════════════════════════════
    // FLOW FIELD GENESIS
    // Tens of thousands of art particles driven by Perlin-noise flow fields.
    // Four particle species: petals, paper, lines, fragments.
    // Density field modulates gathering and whitespace.
    // ══════════════════════════════════════════════════════════════════════

    // ── Palettes: white background, soft purple-blue gradient family ──
    const PALETTES = [
        {
            name: 'Lavender',
            colors: [
                [107, 127, 212], [155, 143, 224], [180, 168, 232],
                [139, 160, 232], [196, 184, 240], [120, 100, 200]
            ],
            bg: [250, 249, 252]
        },
        {
            name: 'Dawn',
            colors: [
                [180, 140, 200], [200, 160, 220], [220, 180, 230],
                [160, 120, 190], [240, 200, 220], [140, 100, 170]
            ],
            bg: [252, 250, 250]
        },
        {
            name: 'Breath',
            colors: [
                [100, 140, 200], [130, 170, 220], [170, 200, 235],
                [110, 150, 210], [200, 220, 240], [80, 120, 185]
            ],
            bg: [249, 250, 252]
        },
        {
            name: 'Moonlit',
            colors: [
                [120, 130, 180], [150, 160, 200], [180, 190, 220],
                [100, 110, 160], [210, 215, 235], [90, 100, 145]
            ],
            bg: [251, 251, 253]
        }
    ];

    // ── Particle species: independent visual elements (NOT lines) ──
    //   0 = soft dot (translucent filled circle)
    //   1 = petal (curved organic shape)
    //   2 = tiny square (rotated rectangle)
    //   3 = small triangle (geometric fragment)
    const TYPES = 4;

    // ── Global state ──
    let palIdx = 0;
    let seed = 12345;
    let pCount = 6000;
    let flowSpeed = 0.6;
    let noiseScale = 0.0030;
    let densityPull = 0.8;
    let trailFade = 0.45;
    let paused = false;

    // ── Particle data (typed arrays for performance) ──
    let N = 0;
    let px, py, vx, vy, ang, angVel, life, maxLife, alpha, size, hue, type;

    // ── Flow field grid ──
    let cols, rows, cellSize = 22;
    let fieldX, fieldY;
    let fieldFrame = 0;

    // ── Density field grid (particle count per cell) ──
    let densGrid, densFrame = 0;

    // ── Wind field (drag interaction) ──
    let windX, windY, windLife;

    // ── Spawn bursts (tap interaction) ──
    let bursts = [];

    // ── Canvas ──
    let W, H;
    let ctx;             // raw 2D context for fast rendering
    let palette;         // current palette object
    let colorCache;      // precomputed rgba strings per color × alpha step
    const ALPHA_STEPS = 12;

    // ── Noise offset (animated) ──
    let zOff = 0;

    // ══════════════════════════════════════════════════════════════════════
    // SETUP
    // ══════════════════════════════════════════════════════════════════════
    function setup() {
        const c = createCanvas(windowWidth, windowHeight);
        c.parent('canvas-container');
        pixelDensity(1);
        ctx = drawingContext;

        W = width; H = height;
        rebuildFieldGrid();
        applyPalette();   // sets `palette` + builds color cache BEFORE particles use it
        applySeed();      // seed RNG + noise BEFORE particle init so seed shapes the world
        initParticles(pCount);

        // remove loading text
        const ld = document.querySelector('.loading');
        if (ld) ld.remove();

        // fade hint after 5s
        setTimeout(() => document.getElementById('hint')?.classList.add('fade'), 5500);
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        W = width; H = height;
        rebuildFieldGrid();
    }

    function rebuildFieldGrid() {
        cols = Math.ceil(W / cellSize) + 1;
        rows = Math.ceil(H / cellSize) + 1;
        fieldX = new Float32Array(cols * rows);
        fieldY = new Float32Array(cols * rows);
        densGrid = new Float32Array(cols * rows);
        const g = cols * rows;
        windX = new Float32Array(g);
        windY = new Float32Array(g);
        windLife = new Float32Array(g);
    }

    // ══════════════════════════════════════════════════════════════════════
    // PARTICLE INIT (typed arrays)
    // ══════════════════════════════════════════════════════════════════════
    function initParticles(count) {
        N = count;
        px = new Float32Array(N);
        py = new Float32Array(N);
        vx = new Float32Array(N);
        vy = new Float32Array(N);
        ang = new Float32Array(N);
        angVel = new Float32Array(N);
        life = new Float32Array(N);
        maxLife = new Float32Array(N);
        alpha = new Float32Array(N);
        size = new Float32Array(N);
        hue = new Uint8Array(N);       // palette color index
        type = new Uint8Array(N);

        for (let i = 0; i < N; i++) respawn(i, true);
    }

    function respawn(i, initial) {
        px[i] = Math.random() * W;
        py[i] = Math.random() * H;
        vx[i] = 0;
        vy[i] = 0;
        ang[i] = Math.random() * Math.PI * 2;
        angVel[i] = (Math.random() - 0.5) * 0.04;
        maxLife[i] = 200 + Math.random() * 400;
        life[i] = initial ? Math.random() * maxLife[i] : maxLife[i];
        alpha[i] = 0;
        size[i] = 2.5 + Math.random() * 7.5;
        hue[i] = (Math.random() * palette.colors.length) | 0;
        type[i] = (Math.random() * TYPES) | 0;
    }

    // ══════════════════════════════════════════════════════════════════════
    // FLOW FIELD (Perlin noise)
    // ══════════════════════════════════════════════════════════════════════
    function computeField() {
        const ns = noiseScale;
        let idx = 0;
        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                // angle from Perlin noise → flow direction
                const n = noise(x * ns * cellSize, y * ns * cellSize, zOff);
                const a = n * Math.PI * 4;  // full rotation range
                fieldX[idx] = Math.cos(a);
                fieldY[idx] = Math.sin(a);
                idx++;
            }
        }
        zOff += 0.0015;
    }

    // ══════════════════════════════════════════════════════════════════════
    // DENSITY FIELD (particle count per cell → gathering/whitespace)
    // ══════════════════════════════════════════════════════════════════════
    function computeDensity() {
        densGrid.fill(0);
        for (let i = 0; i < N; i++) {
            const cx = (px[i] / cellSize) | 0;
            const cy = (py[i] / cellSize) | 0;
            if (cx >= 0 && cx < cols && cy >= 0 && cy < rows) {
                densGrid[cy * cols + cx] += 1;
            }
        }
    }

    function densityAt(cx, cy) {
        if (cx < 0 || cx >= cols || cy < 0 || cy >= rows) return 0;
        return densGrid[cy * cols + cx];
    }

    // ══════════════════════════════════════════════════════════════════════
    // WIND FIELD (drag interaction)
    // ══════════════════════════════════════════════════════════════════════
    let lastDragX = 0, lastDragY = 0, dragging = false;

    function applyWind(gx, gy, wx, wy) {
        const cx = Math.max(0, Math.min(cols - 1, (gx / cellSize) | 0));
        const cy = Math.max(0, Math.min(rows - 1, (gy / cellSize) | 0));
        // spread wind to a 3×3 area
        for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
                const nx = cx + dx, ny = cy + dy;
                if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
                    const k = ny * cols + nx;
                    windX[k] += wx * 0.4;
                    windY[k] += wy * 0.4;
                    windLife[k] = 30;  // frames of wind lifetime
                }
            }
        }
    }

    function decayWind() {
        for (let i = 0; i < windLife.length; i++) {
            if (windLife[i] > 0) {
                windLife[i] -= 1;
                windX[i] *= 0.92;
                windY[i] *= 0.92;
                if (windLife[i] <= 0) {
                    windX[i] = 0;
                    windY[i] = 0;
                }
            }
        }
    }

    // ══════════════════════════════════════════════════════════════════════
    // SPAWN BURST (tap → new art area)
    // ══════════════════════════════════════════════════════════════════════
    function spawnBurst(x, y, count) {
        // redistribute existing particles toward the click point
        const c = count || 400;
        for (let i = 0; i < c; i++) {
            const idx = (Math.random() * N) | 0;
            const r = Math.random() * 60;
            const a = Math.random() * Math.PI * 2;
            px[idx] = x + Math.cos(a) * r;
            py[idx] = y + Math.sin(a) * r;
            vx[idx] = Math.cos(a) * (1 + Math.random() * 2);
            vy[idx] = Math.sin(a) * (1 + Math.random() * 2);
            life[idx] = maxLife[idx];
            // change color & type for fresh visual
            hue[idx] = (Math.random() * palette.colors.length) | 0;
            type[idx] = (Math.random() * TYPES) | 0;
            size[idx] = 2.5 + Math.random() * 7.5;
        }
    }

    // ══════════════════════════════════════════════════════════════════════
    // DRAW LOOP
    // ══════════════════════════════════════════════════════════════════════
    function draw() {
        if (paused) return;

        // ── Trail fade (translucent rectangle over previous frame) ──
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = trailFade;
        ctx.fillStyle = `rgb(${palette.bg[0]},${palette.bg[1]},${palette.bg[2]})`;
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;

        // ── Recompute flow field every 2 frames ──
        if (fieldFrame % 2 === 0) computeField();
        fieldFrame++;

        // ── Recompute density field every 4 frames ──
        if (densFrame % 4 === 0) computeDensity();
        densFrame++;

        // ── Decay wind ──
        decayWind();

        // ── Update + render particles ──
        updateAndRender();

        // ── Process spawn bursts ──
        for (let i = bursts.length - 1; i >= 0; i--) {
            spawnBurst(bursts[i].x, bursts[i].y, bursts[i].n);
        }
        bursts.length = 0;
    }

    function updateAndRender() {
        const speed = flowSpeed;
        const pull = densityPull;
        const inv = 1 / cellSize;
        const vmax = 2.0;
        const cc = colorCache;
        const stepMax = ALPHA_STEPS - 1;

        // All palettes use BLEND (source-over) — soft translucent layering on white
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineCap = 'round';

        for (let i = 0; i < N; i++) {
            // ── UPDATE ──
            const cx = (px[i] * inv) | 0;
            const cy = (py[i] * inv) | 0;
            const gi = (cx >= 0 && cx < cols && cy >= 0 && cy < rows) ? (cy * cols + cx) : -1;

            let fx = 0, fy = 0;
            if (gi >= 0) {
                // Gentle flow field force — reduced to avoid coherent streaks
                fx = fieldX[gi] * speed * 0.22;
                fy = fieldY[gi] * speed * 0.22;

                // Random jitter breaks up coherent flow-field alignment
                // (prevents traditional flow-field line/streak appearance)
                fx += (Math.random() - 0.5) * 0.15;
                fy += (Math.random() - 0.5) * 0.15;

                // Density diffusion: overcrowded cells push particles apart (whitespace),
                // sparse cells let flow gather them naturally (gathering).
                if (pull > 0) {
                    const d = densGrid[gi];
                    if (d > 4) {
                        fx += (Math.random() - 0.5) * pull * 0.4;
                        fy += (Math.random() - 0.5) * pull * 0.4;
                    }
                }

                if (windLife[gi] > 0) {
                    fx += windX[gi] * 0.5;
                    fy += windY[gi] * 0.5;
                }
            }

            vx[i] = vx[i] * 0.90 + fx;
            vy[i] = vy[i] * 0.90 + fy;

            const vmag = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i]);
            if (vmag > vmax) {
                const s = vmax / vmag;
                vx[i] *= s; vy[i] *= s;
            }

            px[i] += vx[i];
            py[i] += vy[i];
            ang[i] += angVel[i] + vmag * 0.02;

            life[i] -= 1;
            const lr = life[i] / maxLife[i];
            let a = 1;
            if (lr > 0.85) a = (1 - lr) / 0.15;
            else if (lr < 0.2) a = lr / 0.2;
            const al = a * 0.42;

            if (px[i] < -10) px[i] = W + 10;
            else if (px[i] > W + 10) px[i] = -10;
            if (py[i] < -10) py[i] = H + 10;
            else if (py[i] > H + 10) py[i] = -10;

            if (life[i] <= 0) { respawn(i, false); continue; }
            if (al < 0.02) continue;

            // ── RENDER ── (single pass, globalAlpha for translucency)
            const sIdx = lr > 1 ? stepMax : (lr < 0 ? 0 : (lr * stepMax) | 0);
            const cs = cc[hue[i]][sIdx];
            ctx.globalAlpha = al;
            ctx.fillStyle = cs;
            ctx.strokeStyle = cs;

            const s = size[i];
            const ti = type[i];

            ctx.save();
            ctx.translate(px[i], py[i]);
            ctx.rotate(ang[i]);

            if (ti === 0) {
                // SOFT DOT — translucent filled circle
                ctx.beginPath();
                ctx.arc(0, 0, s * 0.4, 0, Math.PI * 2);
                ctx.fill();
            } else if (ti === 1) {
                // PETAL — translucent curved shape
                ctx.beginPath();
                ctx.moveTo(0, -s * 0.5);
                ctx.quadraticCurveTo(s * 0.8, 0, 0, s * 0.5);
                ctx.quadraticCurveTo(-s * 0.4, 0, 0, -s * 0.5);
                ctx.fill();
            } else if (ti === 2) {
                // SQUARE — tiny rotated rectangle
                ctx.fillRect(-s * 0.4, -s * 0.4, s * 0.8, s * 0.8);
            } else {
                // FRAGMENT — small triangle
                ctx.beginPath();
                ctx.moveTo(0, -s * 0.55);
                ctx.lineTo(s * 0.5, s * 0.35);
                ctx.lineTo(-s * 0.5, s * 0.35);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }
        ctx.globalAlpha = 1;
    }

    // ══════════════════════════════════════════════════════════════════════
    // COLOR CACHE (precomputed rgba strings per color × alpha step)
    // ══════════════════════════════════════════════════════════════════════
    function buildColorCache() {
        // Precompute interpolated rgb strings along lifecycle (color → next color).
        // Indexing: colorCache[colorIdx][lifeStep] → "rgb(r,g,b)" string.
        // Avoids per-frame string concatenation in the hot render loop.
        colorCache = [];
        const C = palette.colors;
        for (let c = 0; c < C.length; c++) {
            const c1 = C[c];
            const c2 = C[(c + 1) % C.length];
            const row = [];
            for (let s = 0; s < ALPHA_STEPS; s++) {
                const t = s / (ALPHA_STEPS - 1);
                const r = (c1[0] * t + c2[0] * (1 - t)) | 0;
                const g = (c1[1] * t + c2[1] * (1 - t)) | 0;
                const b = (c1[2] * t + c2[2] * (1 - t)) | 0;
                row.push(`rgb(${r},${g},${b})`);
            }
            colorCache.push(row);
        }
    }

    function applyPalette() {
        palette = PALETTES[palIdx];
        buildColorCache();
        const bgCss = `rgb(${palette.bg[0]},${palette.bg[1]},${palette.bg[2]})`;
        document.getElementById('canvas-container').style.background = bgCss;
        document.body.style.background = bgCss;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', bgCss);
        document.getElementById('tc-palette').textContent = palette.name;
        buildPaletteUI();
    }

    function applySeed() {
        noiseSeed(seed);
        randomSeed(seed);
        zOff = seed * 0.0001;
        document.getElementById('tc-seed').textContent = seed;
        document.getElementById('seed-input').value = seed;
    }

    // ══════════════════════════════════════════════════════════════════════
    // INTERACTION (mouse + touch)
    // ══════════════════════════════════════════════════════════════════════
    function mouseDragged() {
        const dx = mouseX - lastDragX;
        const dy = mouseY - lastDragY;
        if (Math.abs(dx) + Math.abs(dy) > 1) {
            applyWind(mouseX, mouseY, dx * 0.4, dy * 0.4);
        }
        lastDragX = mouseX;
        lastDragY = mouseY;
        return false;
    }

    function mousePressed() {
        lastDragX = mouseX;
        lastDragY = mouseY;
        dragging = true;
        return false;
    }

    function mouseReleased() {
        if (dragging) {
            // tap (no significant drag) → spawn burst
            const dx = Math.abs(mouseX - lastDragX);
            const dy = Math.abs(mouseY - lastDragY);
            if (dx < 8 && dy < 8) {
                bursts.push({ x: mouseX, y: mouseY, n: 300 });
            }
        }
        dragging = false;
        return false;
    }

    function touchStarted() { mousePressed(); return false; }
    function touchMoved() { mouseDragged(); return false; }
    function touchEnded() { mouseReleased(); return false; }

    // ══════════════════════════════════════════════════════════════════════
    // UI WIRING
    // ══════════════════════════════════════════════════════════════════════
    function buildPaletteUI() {
        const wrap = document.getElementById('palettes');
        wrap.innerHTML = '';
        PALETTES.forEach((p, i) => {
            const chip = document.createElement('button');
            chip.className = 'palette-chip' + (i === palIdx ? ' active' : '');
            const sw = document.createElement('div');
            sw.className = 'palette-swatches';
            p.colors.slice(0, 5).forEach(c => {
                const sp = document.createElement('span');
                sp.style.background = `rgb(${c[0]},${c[1]},${c[2]})`;
                sw.appendChild(sp);
            });
            chip.appendChild(sw);
            const nm = document.createElement('div');
            nm.className = 'palette-name';
            nm.textContent = p.name;
            chip.appendChild(nm);
            chip.onclick = () => {
                palIdx = i;
                applyPalette();
            };
            wrap.appendChild(chip);
        });
    }

    function regenerate() {
        applySeed();
        initParticles(pCount);
    }

    // ── Wire DOM events ──
    document.addEventListener('DOMContentLoaded', () => {
        const panel = document.getElementById('panel');
        const scrim = document.getElementById('scrim');
        const toggle = document.getElementById('panel-toggle');

        const openPanel = () => { panel.classList.add('open'); scrim.classList.add('show'); };
        const closePanel = () => { panel.classList.remove('open'); scrim.classList.remove('show'); };

        toggle.onclick = openPanel;
        scrim.onclick = closePanel;

        // Seed controls
        document.getElementById('seed-input').addEventListener('change', e => {
            seed = parseInt(e.target.value) || 1;
            applySeed();
        });
        document.getElementById('seed-prev').onclick = () => { seed -= 1; applySeed(); };
        document.getElementById('seed-next').onclick = () => { seed += 1; applySeed(); };
        document.getElementById('seed-random').onclick = () => {
            seed = Math.floor(Math.random() * 999999);
            applySeed();
        };

        // Sliders — all take effect immediately
        const bind = (sid, vid, fmt, onChange) => {
            const s = document.getElementById(sid);
            const v = document.getElementById(vid);
            s.addEventListener('input', () => {
                const val = parseFloat(s.value);
                v.textContent = fmt(val);
                onChange(val);
            });
        };
        // Particle count: debounced reinit so dragging doesn't lag
        let countTimer = null;
        bind('s-count', 'v-count', v => v.toFixed(0), v => {
            pCount = v|0;
            clearTimeout(countTimer);
            countTimer = setTimeout(() => initParticles(pCount), 200);
        });
        bind('s-speed', 'v-speed', v => v.toFixed(1), v => { flowSpeed = v; });
        bind('s-noise', 'v-noise', v => v.toFixed(4), v => { noiseScale = v; });
        bind('s-density', 'v-density', v => v.toFixed(1), v => { densityPull = v; });
        bind('s-trail', 'v-trail', v => v.toFixed(2), v => { trailFade = v; });

        // Buttons
        document.getElementById('btn-regenerate').onclick = regenerate;
        document.getElementById('btn-pause').onclick = e => {
            paused = !paused;
            e.target.textContent = paused ? 'Resume' : 'Pause';
        };
        document.getElementById('btn-save').onclick = () => {
            saveCanvas('flow-field-genesis', 'png');
        };
    });
    </script>
</body>
